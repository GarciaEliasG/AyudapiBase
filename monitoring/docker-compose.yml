services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ayudapi-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: ayudapi-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Cambiar esta contraseña antes de exponer el puerto a internet.
      - GF_SECURITY_ADMIN_PASSWORD=cambiar_esta_password
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus-data:
  grafana-data:
